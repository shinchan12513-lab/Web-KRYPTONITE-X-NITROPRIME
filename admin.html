<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kryptonite X Nitroprime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0B0B0B; color: #ffffff; padding: 20px; }
        .container { max-width: 1100px; margin: 30px auto; background: #121212; border: 1px solid rgba(0, 175, 255, 0.3); border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        h2 i { color: #00AFFF; }
        .admin-badge { display: inline-block; background: rgba(0, 175, 255, 0.15); color: #00AFFF; padding: 4px 10px; border-radius: 6px; font-size: 12px; border: 1px solid rgba(0, 175, 255, 0.3); margin-top: 5px; }
        hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 20px 0; }
        
        /* Search & Table Styles */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 10px 15px; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: #00AFFF; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #181818; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #1f1f1f; color: #00AFFF; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .btn { padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background: #00AFFF; color: #0B0B0B; }
        .btn-primary:hover { background: #0088cc; }
        .btn-warning { background: #f59e0b; color: #0B0B0B; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-role { background: #8b5cf6; color: #fff; }
        .btn-role:hover { background: #7c3aed; }
        
        .back-link { display: inline-block; margin-top: 25px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #00AFFF; }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-shield-halved"></i> แผงควบคุมผู้ดูแลระบบ</h2>
        <p>ยินดีต้อนรับคุณ <span id="adminName" style="color: #00AFFF; font-weight: bold;"></span> (ผู้ดูแลระบบสูงสุด)</p>
        <div class="admin-badge"><i class="fa-solid fa-circle-check"></i> ระบบจัดการสมาชิกและสิทธิ์</div>
        
        <hr>

        <h3><i class="fa-solid fa-users"></i> ค้นหาและจัดการสมาชิก</h3>
        <div class="search-box" style="margin-top: 15px;">
            <input type="text" id="searchInput" placeholder="พิมพ์ชื่อยูสเซอร์ลูกค้าเพื่อค้นหา..." onkeyup="filterTable()">
        </div>

        <div style="overflow-x: auto;">
            <table id="memberTable">
                <thead>
                    <tr>
                        <th>ชื่อยูสเซอร์ (Username)</th>
                        <th>สถานะสิทธิ์</th>
                        <th>วันที่สมัครสมาชิก</th>
                        <th>ยอดเครดิตคงเหลือ</th>
                        <th>จัดการเครดิต</th>
                        <th>จัดการสิทธิ์</th>
                        <th>การจัดการอื่นๆ</th>
                    </tr>
                </thead>
                <tbody id="memberTableBody">
                    <!-- ข้อมูลจะถูกดึงมาแสดงด้วย JavaScript -->
                </tbody>
            </table>
        </div>

        <a href="shop.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลักร้านค้า</a>
    </div>

    <script>
        // 1. ตรวจสอบสิทธิ์ความปลอดภัย (เช็คทั้ง isAdmin เป็น true หรือ role ใน allMembers เป็น ADMIN)
        const currentUsername = localStorage.getItem('username');
        let members = JSON.parse(localStorage.getItem('allMembers')) || [
            { username: currentUsername || 'sasdsasdas', role: 'ADMIN', registerDate: '26/09/2026 12:00', balance: parseFloat(localStorage.getItem('userBalance')) || 15.97 },
            { username: 'testuser01', role: 'MEMBER', registerDate: '25/09/2026 18:30', balance: 100.00 },
            { username: 'pro_gamer99', role: 'VIP', registerDate: '24/09/2026 09:15', balance: 500.50 }
        ];

        const currentUserObj = members.find(m => m.username === currentUsername);
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const isUserAdmin = (localStorage.getItem('isAdmin') === 'true') || (currentUserObj && currentUserObj.role === 'ADMIN');

        if (!isLoggedIn || !isUserAdmin) {
            alert('⚠️ แจ้งเตือน: คุณไม่มีสิทธิ์เข้าถึงหน้านี้!');
            window.location.href = 'shop.html';
        } else {
            document.getElementById('adminName').innerText = currentUsername || 'admin';
        }

        function saveMembersData() {
            localStorage.setItem('allMembers', JSON.stringify(members));
            // ซิงค์ยอดเงินและสถานะของตัวเอง
            const me = members.find(m => m.username === currentUsername);
            if (me) {
                localStorage.setItem('userBalance', me.balance);
                if (me.role === 'ADMIN') {
                    localStorage.setItem('isAdmin', 'true');
                } else {
                    localStorage.removeItem('isAdmin');
                }
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8;">ไม่พบข้อมูลสมาชิก</td></tr>`;
                return;
            }

            data.forEach((member) => {
                let badgeColor = 'rgba(255,255,255,0.05); color:#94a3b8';
                if (member.role === 'ADMIN') badgeColor = 'rgba(0,175,255,0.2); color:#00AFFF';
                if (member.role === 'VIP') badgeColor = 'rgba(245,158,11,0.2); color:#f59e0b';

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 600; color: #fff;"><i class="fa-solid fa-user" style="color: #00AFFF; margin-right: 6px;"></i> ${member.username}</td>
                        <td><span style="font-size:11px; padding: 3px 8px; border-radius: 4px; background: ${badgeColor}; font-weight: bold;">${member.role}</span></td>
                        <td style="color: #94a3b8; font-size: 12px;"><i class="fa-regular fa-calendar-days" style="margin-right: 4px;"></i> ${member.registerDate || 'ไม่ระบุ'}</td>
                        <td style="color: #00AFFF; font-weight: bold;">฿${member.balance.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-primary" onclick="addCredit('${member.username}')"><i class="fa-solid fa-plus"></i> เพิ่มเครดิต</button>
                        </td>
                        <td>
                            <button class="btn btn-role" onclick="changeRole('${member.username}')"><i class="fa-solid fa-user-gear"></i> เปลี่ยนสถานะ</button>
                        </td>
                        <td>
                            <button class="btn btn-warning" onclick="resetHwid('${member.username}')"><i class="fa-solid fa-key"></i> รีเซ็ต HWID</button>
                            <button class="btn btn-danger" onclick="deleteUser('${member.username}')"><i class="fa-solid fa-trash"></i> ลบ</button>
                        </td>
                    </tr>
                `;
            });
        }

        // ฟังก์ชันค้นหาสมาชิก
        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = members.filter(m => m.username.toLowerCase().includes(keyword));
            renderTable(filtered);
        }

        // ฟังก์ชันเพิ่มเครดิต
        function addCredit(username) {
            const amountStr = prompt(`ระบุจำนวนเครดิตที่ต้องการเพิ่มให้ ${username}:`, "100");
            if (amountStr !== null) {
                const amount = parseFloat(amountStr);
                if (!isNaN(amount) && amount > 0) {
                    const target = members.find(m => m.username === username);
                    if (target) {
                        target.balance += amount;
                        saveMembersData();
                        renderTable(members);
                        alert(`✅ เพิ่มเครดิตให้ ${username} สำเร็จ!`);
                    }
                } else {
                    alert('❌ กรุณากรอกตัวเลขจำนวนเงินให้ถูกต้อง');
                }
            }
        }

        // ฟังก์ชันเปลี่ยนสถานะ (ROLE)
        function changeRole(username) {
            const newRole = prompt(`เปลี่ยนสถานะของ ${username}\nกรุณาพิมพ์ชื่อสถานะที่ต้องการ (MEMBER, VIP, ADMIN):`, "ADMIN");
            if (newRole !== null) {
                const upperRole = newRole.trim().toUpperCase();
                if (['MEMBER', 'VIP', 'ADMIN'].includes(upperRole)) {
                    const target = members.find(m => m.username === username);
                    if (target) {
                        target.role = upperRole;
                        saveMembersData();
                        renderTable(members);
                        alert(`✅ เปลี่ยนสถานะของ ${username} เป็น ${upperRole} สำเร็จ!`);
                        
                        // หากเปลี่ยนสถานะตัวเองเป็นอย่างอื่นที่ไม่ใช่ ADMIN ให้เด้งออกทันที
                        if (username === currentUsername && upperRole !== 'ADMIN') {
                            window.location.href = 'shop.html';
                        }
                    }
                } else {
                    alert('❌ สถานะไม่ถูกต้อง! กรุณาใส่เฉพาะ MEMBER, VIP หรือ ADMIN เท่านั้น');
                }
            }
        }

        // ฟังก์ชันรีเซ็ต HWID
        function resetHwid(username) {
            if (confirm(`คุณต้องการรีเซ็ต HWID ให้กับบัญชี ${username} ใช่หรือไม่?`)) {
                alert(`✅ รีเซ็ต HWID ของ ${username} เรียบร้อยแล้ว`);
            }
        }

        // ฟังก์ชันลบบัญชีผู้ใช้
        function deleteUser(username) {
            if (username === 'admin' && members.filter(m => m.role === 'ADMIN').length <= 1) {
                alert('⚠️ ไม่สามารถลบบัญชีผู้ดูแลระบบคนสุดท้ายของระบบได้!');
                return;
            }
            if (confirm(`⚠️ คำเตือน: คุณต้องการลบบัญชี ${username} ออกจากระบบใช่หรือไม่?`)) {
                members = members.filter(m => m.username !== username);
                saveMembersData();
                renderTable(members);
                alert(`🗑️ ลบบัญชี ${username} สำเร็จ`);
            }
        }

        // บันทึกและแสดงผล
        saveMembersData();
        renderTable(members);
    </script>
</body>
</html>
