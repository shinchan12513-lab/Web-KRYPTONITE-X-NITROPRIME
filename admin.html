<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kryptonite X Nitroprime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0B0B0B; color: #ffffff; padding: 20px; }
        .container { max-width: 1200px; margin: 30px auto; background: #121212; border: 1px solid rgba(0, 175, 255, 0.3); border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        h2 i { color: #00AFFF; }
        .admin-badge { display: inline-block; background: rgba(0, 175, 255, 0.15); color: #00AFFF; padding: 4px 10px; border-radius: 6px; font-size: 12px; border: 1px solid rgba(0, 175, 255, 0.3); margin-top: 5px; }
        hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 20px 0; }
        
        /* Search & Table Styles */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 10px 15px; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: #00AFFF; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #181818; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #1f1f1f; color: #00AFFF; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .btn { padding: 6px 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 3px; }
        .btn-primary { background: #00AFFF; color: #0B0B0B; }
        .btn-primary:hover { background: #0088cc; }
        .btn-warning { background: #f59e0b; color: #0B0B0B; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-role { background: #8b5cf6; color: #fff; }
        .btn-role:hover { background: #7c3aed; }
        
        .back-link { display: inline-block; margin-top: 25px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #00AFFF; }
    </style>

    <!-- เชื่อมต่อ Firebase SDK และดึงข้อมูล Real-time -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBeNLxh_6mPR9L8Ftw8XlmxgezY2dP_1LU",
            authDomain: "kryptonite-nitroprime.firebaseapp.com",
            projectId: "kryptonite-nitroprime",
            storageBucket: "kryptonite-nitroprime.firebasestorage.app",
            messagingSenderId: "802119898761",
            appId: "1:802119898761:web:6ac8099014fab7ea41d858",
            measurementId: "G-MMTCVN81ZS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let membersList = [];

        document.addEventListener('DOMContentLoaded', () => {
            const currentUsername = localStorage.getItem('username') || 'admin';
            document.getElementById('adminName').innerText = currentUsername;

            // ดึงข้อมูลสมาชิกแบบ Real-time จาก Firebase
            onSnapshot(collection(db, "members"), (snapshot) => {
                membersList = [];
                snapshot.forEach((docSnap) => {
                    membersList.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderTable(membersList);
            });
        });

        function renderTable(data) {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">ไม่พบข้อมูลสมาชิก</td></tr>`;
                return;
            }

            data.forEach((member) => {
                let badgeColor = 'rgba(255,255,255,0.05); color:#94a3b8';
                if (member.role === 'ADMIN') badgeColor = 'rgba(0,175,255,0.2); color:#00AFFF';
                if (member.role === 'VIP') badgeColor = 'rgba(245,158,11,0.2); color:#f59e0b';

                let currentBalance = parseFloat(member.balance) || 0.00;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 600; color: #fff;"><i class="fa-solid fa-user" style="color: #00AFFF; margin-right: 6px;"></i> ${member.username}</td>
                        <td><span style="font-size:11px; padding: 3px 8px; border-radius: 4px; background: ${badgeColor}; font-weight: bold;">${member.role || 'MEMBER'}</span></td>
                        <td style="color: #94a3b8; font-size: 12px;"><i class="fa-regular fa-calendar-days" style="margin-right: 4px;"></i> ${member.registerDate || 'ไม่ระบุ'}</td>
                        <td style="color: #00AFFF; font-weight: bold;">฿${currentBalance.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-primary" onclick="window.updateCredit('${member.id}', '${member.username}', ${currentBalance}, 'add')"><i class="fa-solid fa-plus"></i> เพิ่ม</button>
                            <button class="btn btn-warning" onclick="window.updateCredit('${member.id}', '${member.username}', ${currentBalance}, 'sub')"><i class="fa-solid fa-minus"></i> หัก</button>
                        </td>
                        <td>
                            <button class="btn btn-role" onclick="window.updateRole('${member.id}', '${member.username}', '${member.role || 'MEMBER'}')"><i class="fa-solid fa-user-gear"></i> สิทธิ์</button>
                            <button class="btn btn-danger" onclick="window.removeUser('${member.id}', '${member.username}')"><i class="fa-solid fa-trash"></i> ลบ</button>
                        </td>
                    </tr>
                `;
            });
        }

        // ฟังก์ชันค้นหา
        window.filterTable = function() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = membersList.filter(m => m.username.toLowerCase().includes(keyword));
            renderTable(filtered);
        }

        // ฟังก์ชันจัดการเพิ่ม/ลดเครดิตใน Firebase
        window.updateCredit = async function(docId, username, oldBalance, mode) {
            const actionText = mode === 'add' ? 'เพิ่มเครดิตให้' : 'หักเครดิตออกจาก';
            const amountStr = prompt(`ระบุจำนวนเครดิตที่ต้องการ${actionText} ${username}:`, "100");
            
            if (amountStr !== null) {
                const amount = parseFloat(amountStr);
                if (!isNaN(amount) && amount > 0) {
                    let newBalance = mode === 'add' ? oldBalance + amount : oldBalance - amount;
                    
                    if (newBalance < 0) {
                        alert('❌ ไม่สามารถหักเครดิตให้ยอดเงินติดลบได้');
                        return;
                    }

                    try {
                        await updateDoc(doc(db, "members", docId), { balance: newBalance });
                        alert(`✅ อัปเดตเครดิต ${username} สำเร็จ! (คงเหลือ ฿${newBalance.toFixed(2)})`);
                    } catch (err) {
                        console.error(err);
                        alert('❌ เกิดข้อผิดพลาดในการอัปเดตเครดิต');
                    }
                } else {
                    alert('❌ กรุณากรอกตัวเลขจำนวนเงินให้ถูกต้อง');
                }
            }
        }

        // ฟังก์ชันเปลี่ยนสิทธิ์ใน Firebase
        window.updateRole = async function(docId, username, currentRole) {
            const newRole = prompt(`เปลี่ยนสถานะของ ${username}\nกรุณาพิมพ์ชื่อสถานะที่ต้องการ (MEMBER, VIP, ADMIN):`, currentRole);
            if (newRole !== null) {
                const upperRole = newRole.trim().toUpperCase();
                if (['MEMBER', 'VIP', 'ADMIN'].includes(upperRole)) {
                    try {
                        await updateDoc(doc(db, "members", docId), { role: upperRole });
                        alert(`✅ เปลี่ยนสถานะของ ${username} เป็น ${upperRole} สำเร็จ!`);
                    } catch (err) {
                        console.error(err);
                        alert('❌ เกิดข้อผิดพลาดในการเปลี่ยนสถานะ');
                    }
                } else {
                    alert('❌ สถานะไม่ถูกต้อง! (ต้องเป็น MEMBER, VIP หรือ ADMIN เท่านั้น)');
                }
            }
        }

        // ฟังก์ชันลบผู้ใช้ใน Firebase
        window.removeUser = async function(docId, username) {
            if (confirm(`⚠️ คำเตือน: คุณต้องการลบบัญชี ${username} ออกจากระบบใช่หรือไม่?`)) {
                try {
                    await deleteDoc(doc(db, "members", docId));
                    alert(`🗑️ ลบบัญชี ${username} สำเร็จ`);
                } catch (err) {
                    console.error(err);
                    alert('❌ เกิดข้อผิดพลาดในการลบข้อมูล');
                }
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-shield-halved"></i> แผงควบคุมผู้ดูแลระบบ</h2>
        <p>ยินดีต้อนรับคุณ <span id="adminName" style="color: #00AFFF; font-weight: bold;"></span> (ผู้ดูแลระบบสูงสุด)</p>
        <div class="admin-badge"><i class="fa-solid fa-circle-check"></i> ระบบจัดการสมาชิกและสิทธิ์ (Real-time Firebase)</div>
        
        <hr>

        <h3><i class="fa-solid fa-users"></i> ค้นหาและจัดการสมาชิก</h3>
        <div class="search-box" style="margin-top: 15px;">
            <input type="text" id="searchInput" placeholder="พิมพ์ชื่อยูสเซอร์ลูกค้าเพื่อค้นหา..." onkeyup="filterTable()">
        </div>

        <div style="overflow-x: auto;">
            <table id="memberTable">
                <thead>
                    <tr>
                        <th>ชื่อยูสเซอร์ (Username)</th>
                        <th>สถานะสิทธิ์</th>
                        <th>วันที่สมัครสมาชิก</th>
                        <th>ยอดเครดิตคงเหลือ</th>
                        <th>จัดการเครดิต (เพิ่ม / หัก)</th>
                        <th>การจัดการ (สิทธิ์ / ลบ)</th>
                    </tr>
                </thead>
                <tbody id="memberTableBody">
                    <!-- ข้อมูลจะถูกดึงมาแสดงด้วย Firebase Real-time -->
                </tbody>
            </table>
        </div>

        <a href="shop.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลักร้านค้า</a>
    </div>
</body>
</html>
