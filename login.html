<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Vortex Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B0B0B; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #121212; border: 1px solid rgba(0, 175, 255, 0.3); padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .login-box h2 { color: #00AFFF; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #00AFFF; }
        .btn-submit { width: 100%; padding: 12px; background: #00AFFF; color: #0B0B0B; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-submit:hover { background: #0088cc; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Vortex Official</h2>
        <form id="loginForm">
            <div class="input-group">
                <label><i class="fa-solid fa-user"></i> ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="usernameInput" placeholder="กรอกชื่อของคุณ..." required autocomplete="off">
            </div>
            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            
            // บันทึกสถานะล็อกอิน
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', username);
            
            // เช็กไอดีแอดมิน (กำหนดให้ชื่อ 'admin' เป็นผู้ดูแลระบบ)
            if (username === 'admin') {
                localStorage.setItem('isAdmin', 'true');
            } else {
                localStorage.removeItem('isAdmin');
            }
            
            // พาไปหน้าหลักร้านค้า
            window.location.href = 'shop.html';
        });
    </script>
</body>
</html>
