<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryptonite X Nitroprime - Official Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* สไตล์สำหรับปุ่มโซเชียลมุมซ้ายและขวาล่าง */
        .corner-social {
            position: fixed;
            bottom: 25px;
            display: flex;
            gap: 12px;
            z-index: 999;
        }
        .corner-social.left {
            left: 30px;
        }
        .corner-social.right {
            right: 30px;
        }
        .social-btn {
            width: 45px;
            height: 45px;
            background: rgba(18, 18, 21, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .social-btn.youtube:hover {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transform: translateY(-3px);
        }
        .social-btn.discord:hover {
            background: #5865F2;
            color: #fff;
            border-color: #5865F2;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .corner-social.left { left: 15px; bottom: 15px; }
            .corner-social.right { right: 15px; bottom: 15px; }
            .social-btn { width: 38px; height: 38px; font-size: 15px; }
        }
    </style>
</head>
<body class="fade-page">

    <!-- แสงเรืองแสงพื้นหลัง -->
    <div class="bg-glow"></div>

    <!-- โซเชียลมุมซ้ายล่าง (YouTube & Discord) -->
    <div class="corner-social left">
        <a href="ใส่ลิงก์ยูทูปของคุณตรงนี้" target="_blank" class="social-btn youtube" title="YouTube">
            <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="ใส่ลิงก์ดิสคอร์ดของคุณตรงนี้" target="_blank" class="social-btn discord" title="Discord">
            <i class="fa-brands fa-discord"></i>
        </a>
    </div>

    <!-- โซเชียลมุมขวาล่าง (YouTube & Discord) -->
    <div class="corner-social right">
        <a href="ใส่ลิงก์ยูทูปของคุณตรงนี้" target="_blank" class="social-btn youtube" title="YouTube">
            <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="ใส่ลิงก์ดิสคอร์ดของคุณตรงนี้" target="_blank" class="social-btn discord" title="Discord">
            <i class="fa-brands fa-discord"></i>
        </a>
    </div>

    <div class="welcome-container">
        <!-- ป้ายแจ้งเตือนด้านบน -->
        <div class="badge-top">
            <i class="fa-solid fa-bolt"></i> PREMIUM FIVEM SERVICE
        </div>

        <!-- ชื่อแบรนด์แบบคู่ -->
        <div class="logo-area">
            <h1>KRYPTONITE <span class="x-mark">X</span> NITROPRIME</h1>
        </div>

        <!-- คำโปรยสั้นๆ -->
        <p class="subtitle">ให้บริการเพิ่มประสิทธิภาพ Fivem ปลอดภัย รวดเร็ว ทันใจ</p>

        <!-- แถบฟีเจอร์เด่น -->
        <div class="features-bar">
            <span><i class="fa-solid fa-robot"></i> ให้บริการ 24 ชม.</span>
            <span><i class="fa-solid fa-shield-halved"></i> ปลอดภัย 100%</span>
            <span><i class="fa-solid fa-headset"></i> มีทีมงานดูแลตลอด</span>
        </div>

        <!-- ปุ่มกดเข้าเว็บ -->
        <div class="btn-group">
            <a href="shop.html" class="btn btn-primary transition-link">เข้าสู่เว็บไซต์ <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </div>

    <!-- ส่วนท้ายเว็บ -->
    <footer>
        <p>&copy; 2026 KRYPTONITE X NITROPRIME — All rights reserved.</p>
    </footer>

    <!-- Script สำหรับทำอนิเมชั่นเปลี่ยนหน้าแบบสมูท -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const link = document.querySelector('.transition-link');
            if (link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetUrl = this.getAttribute('href');
                    
                    document.body.style.opacity = '1';
                    document.body.style.transition = 'opacity 0.5s ease';
                    document.body.style.opacity = '0';

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500);
                });
            }
        });
    </script>

</body>
</html>
