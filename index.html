<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryptonite X Nitroprime - Official Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* บังคับหน้าจอให้เต็มจอเพื่อล็อกตำแหน่งปุ่มมุมซ้าย-ขวา */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0B0B0B;
            font-family: 'Prompt', sans-serif;
            color: #ffffff;
        }

        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 175, 255, 0.12) 0%, rgba(11, 11, 11, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* สไตล์สำหรับปุ่มโซเชียลและข้อความมุมซ้ายและขวาล่าง (ล็อกตำแหน่งแน่นอน) */
        .corner-container {
            position: fixed;
            bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
        }
        .corner-container.left {
            left: 30px;
        }
        .corner-container.right {
            right: 30px;
            flex-direction: row-reverse;
        }
        .social-icons-group {
            display: flex;
            gap: 8px;
        }
        .social-btn {
            width: 42px;
            height: 42px;
            background: rgba(18, 18, 21, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .social-btn.youtube:hover {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .social-btn.discord:hover {
            background: #5865F2;
            color: #fff;
            border-color: #5865F2;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
            transform: translateY(-2px);
        }
        .corner-label {
            font-family: 'Prompt', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            transition: color 0.3s ease;
            user-select: none;
        }
        .corner-container:hover .corner-label {
            color: rgba(255, 255, 255, 0.7);
        }

        /* จัดกึ่งกลางเนื้อหาต้อนรับหลัก */
        .welcome-wrapper {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .badge-top {
            background: rgba(0, 175, 255, 0.1);
            border: 1px solid rgba(0, 175, 255, 0.3);
            color: #00AFFF;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .logo-area h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .logo-area .x-mark {
            color: #00AFFF;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .features-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .features-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .features-bar i {
            color: #00AFFF;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0055ff 0%, #00AFFF 100%);
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(0, 175, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 175, 255, 0.7);
        }

        /* ฟุตเตอร์ล่างสุดตรงกลางหน้าต้อนรับ */
        .landing-footer {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .corner-container.left { left: 15px; bottom: 45px; }
            .corner-container.right { right: 15px; bottom: 45px; }
            .social-btn { width: 36px; height: 36px; font-size: 14px; }
            .corner-label { display: none; /* ซ่อนข้อความชื่อสโตร์บนมือถือเพื่อไม่ให้เบียด */ }
            .logo-area h1 { font-size: 24px; }
            .features-bar { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body class="fade-page">

    <!-- แสงเรืองแสงพื้นหลัง -->
    <div class="bg-glow"></div>

    <!-- มุมซ้ายล่าง: KRYPTONITE STORE + โซเชียล -->
    <div class="corner-container left">
        <span class="corner-label">KRYPTONITE STORE</span>
        <div class="social-icons-group">
            <a href="https://www.youtube.com/@MajorUzi" target="_blank" class="social-btn youtube" title="YouTube Kryptonite">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://discord.gg/DuWWvxs6P4" target="_blank" class="social-btn discord" title="Discord Kryptonite">
                <i class="fa-brands fa-discord"></i>
            </a>
        </div>
    </div>

    <!-- มุมขวาล่าง: NITROPRIME STORE + โซเชียล -->
    <div class="corner-container right">
        <span class="corner-label">NITROPRIME STORE</span>
        <div class="social-icons-group">
            <a href="https://www.youtube.com/@KINGNITROPRIME" target="_blank" class="social-btn youtube" title="YouTube Nitroprime">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://discord.gg/QEt5gCyhxx" target="_blank" class="social-btn discord" title="Discord Nitroprime">
                <i class="fa-brands fa-discord"></i>
            </a>
        </div>
    </div>

    <!-- เนื้อหาหลักตรงกลางหน้าจอ -->
    <div class="welcome-wrapper">
        <div class="badge-top">
            <i class="fa-solid fa-bolt"></i> PREMIUM FIVEM SERVICE
        </div>

        <div class="logo-area">
            <h1>KRYPTONITE <span class="x-mark">X</span> NITROPRIME</h1>
        </div>

        <p class="subtitle">ให้บริการเพิ่มประสิทธิภาพ Fivem ปลอดภัย รวดเร็ว ทันใจ</p>

        <div class="features-bar">
            <span><i class="fa-solid fa-robot"></i> ให้บริการ 24 ชม.</span>
            <span><i class="fa-solid fa-shield-halved"></i> ปลอดภัย 100%</span>
            <span><i class="fa-solid fa-headset"></i> มีทีมงานดูแลตลอด</span>
        </div>

        <div class="btn-group">
            <a href="shop.html" class="btn-primary transition-link">เข้าสู่เว็บไซต์ <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </div>

    <!-- ส่วนท้ายเว็บ -->
    <div class="landing-footer">
        <p>&copy; 2026 KRYPTONITE X NITROPRIME — All rights reserved.</p>
    </div>

    <!-- Script สำหรับทำอนิเมชั่นเปลี่ยนหน้าแบบสมูท -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const link = document.querySelector('.transition-link');
            if (link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetUrl = this.getAttribute('href');
                    
                    document.body.style.opacity = '1';
                    document.body.style.transition = 'opacity 0.5s ease';
                    document.body.style.opacity = '0';

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500);
                });
            }
        });
    </script>

</body>
</html>
