<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - Kryptonite X Nitroprime</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- โหลด Firebase SDK และเชื่อมต่อฐานข้อมูล -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBeNLxh_6mPR9L8Ftw8XlmxgezY2dP_1LU",
            authDomain: "kryptonite-nitroprime.firebaseapp.com",
            projectId: "kryptonite-nitroprime",
            storageBucket: "kryptonite-nitroprime.firebasestorage.app",
            messagingSenderId: "802119898761",
            appId: "1:802119898761:web:6ac8099014fab7ea41d858",
            measurementId: "G-MMTCVN81ZS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('usernameInput').value.trim();
                const password = document.getElementById('passwordInput').value;
                const confirmPassword = document.getElementById('confirmPasswordInput').value;

                if (password !== confirmPassword) {
                    alert('⚠️ รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่อีกครั้ง');
                    return;
                }

                try {
                    // ตรวจสอบชื่อผู้ใช้ซ้ำใน Firebase Cloud
                    const q = query(collection(db, "members"), where("username", "==", username));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        alert('⚠️ ชื่อผู้ใช้นี้ถูกใช้งานแล้วในระบบ');
                        return;
                    }

                    let now = new Date();
                    let formattedDate = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                    // บันทึกข้อมูลลง Cloud Firestore
                    await addDoc(collection(db, "members"), {
                        username: username,
                        password: password,
                        role: username === 'admin' ? 'ADMIN' : 'MEMBER',
                        registerDate: formattedDate,
                        balance: 0.00
                    });

                    alert('✅ สมัครสมาชิกสำเร็จ!');
                    window.location.href = 'login.html';

                } catch (error) {
                    console.error("Error adding document: ", error);
                    alert('❌ เกิดข้อผิดพลาดในการสมัครสมาชิก กรุณาลองใหม่อีกครั้ง');
                }
            });
        });
    </script>
</head>
<body class="fade-page auth-page-body">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="shop.html" class="brand-logo">KRYPTONITE <span class="x-mark">X</span> NITROPRIME</a>
                <p>สร้างบัญชีใหม่เพื่อเริ่มต้นใช้งาน</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="input-group">
                    <label><i class="fa-solid fa-user"></i> ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="usernameInput" placeholder="กำหนดชื่อผู้ใช้งาน" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-lock"></i> รหัสผ่าน</label>
                    <input type="password" id="passwordInput" placeholder="กำหนดรหัสผ่าน" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-lock"></i> ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirmPasswordInput" placeholder="ยืนยันรหัสผ่านอีกครั้ง" required>
                </div>

                <button type="submit" class="btn-auth-submit">สมัครสมาชิก</button>
            </form>

            <div class="auth-footer-text">
                <p>มีบัญชีอยู่แล้วใช่ไหม? <a href="login.html">เข้าสู่ระบบ</a></p>
            </div>
        </div>
    </div>
</body>
</html>
